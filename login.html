<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LifeOS</title>
  <meta name="description" content="Sign in to your LifeOS personal productivity workspace." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #0b1322 0%, #111e33 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .brand-leaf {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    .brand-titles h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .brand-titles p {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .password-wrap {
      position: relative;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.6;
    }

    .btn-submit {
      width: 100%;
      background: #1e6bf2;
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(30, 107, 242, 0.3);
    }

    .btn-submit:hover {
      background: #1557c0;
      transform: translateY(-1px);
    }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .auth-footer a {
      color: #1e6bf2;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .demo-accounts {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
    }

    .demo-accounts-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-btn {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      text-align: left;
      font-size: 12px;
      color: #334155;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .demo-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .demo-btn strong {
      color: #0f172a;
    }

    .alert-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Brand Logo -->
      <a href="/" class="brand-header">
        <div class="brand-leaf">🌱</div>
        <div class="brand-titles">
          <h1>LifeOS</h1>
          <p>Organize your life. Build your future.</p>
        </div>
      </a>

      <h2 class="auth-title">Sign in to your account</h2>
      <p class="auth-subtitle">Welcome back! Please enter your details to access your workspace.</p>

      <div id="alreadyAuthNotice" style="display: none; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 13px; color: #166534; justify-content: space-between; align-items: center;">
        <div>
          <span>Currently active: <strong id="activeUserLabel"></strong></span>
        </div>
        <a href="/index.html" style="text-decoration: none; padding: 5px 12px; font-size: 12px; font-weight: 600; background: #16a34a; color: white; border-radius: 6px;">Workspace →</a>
      </div>

      <div id="authAlert" class="alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" value="rakesh.mca@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">
            <span>Password</span>
          </label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required autocomplete="current-password" />
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 13px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #475569;">
            <input type="checkbox" id="rememberMe" checked style="accent-color: #1e6bf2;" />
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Sign In</span>
          <span>→</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Sign up for free</a>
      </div>

      <!-- Quick 1-Click Multi-Tenant Demo Logins -->
      <div class="demo-accounts">
        <div class="demo-accounts-title">
          <span>⚡ Quick 1-Click Demo Profiles</span>
          <span style="font-weight: 500; font-size: 10px; color: #10b981;">Multi-Tenant Ready</span>
        </div>
        <button type="button" class="demo-btn" onclick="quickFillLogin('rakesh.mca@example.com', 'password123')">
          <div>
            <strong>Rakesh (MCA Student)</strong>
            <div style="color: #64748b; font-size: 11px;">7 Tasks • 5 Goals • 7 Habits • Indian Rupee (₹)</div>
          </div>
          <span>➜</span>
        </button>
        <button type="button" class="demo-btn" onclick="quickFillLogin('sarah@example.com', 'password123')">
          <div>
            <strong>Sarah Connor (Software Eng)</strong>
            <div style="color: #64748b; font-size: 11px;">3 Tasks • 2 Goals • 3 Habits • USD ($)</div>
          </div>
          <span>➜</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    window.__VITE_API_BASE_URL__ = "%VITE_API_BASE_URL%";
  </script>
  <script src="/js/apiService.js"></script>

  <script>
    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '👁️‍🗨️';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function quickFillLogin(email, pass) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alertEl = document.getElementById('authAlert');
      const submitBtn = document.getElementById('submitBtn');

      alertEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Signing in...</span>';

      try {
        const res = await window.apiService.auth.login(email, password);
        submitBtn.innerHTML = '<span>✓ Success! Redirecting...</span>';
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 350);
      } catch (err) {
        alertEl.textContent = err.message || 'Login failed. Please check your credentials.';
        alertEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span><span>→</span>';
      }
    });

    // If already authenticated, display status banner
    if (window.apiService && window.apiService.auth.isAuthenticated()) {
      const currentUser = window.apiService.auth.getCurrentUser();
      if (currentUser) {
        const notice = document.getElementById('alreadyAuthNotice');
        const label = document.getElementById('activeUserLabel');
        if (notice && label) {
          label.textContent = `${currentUser.name} (${currentUser.role || 'Member'})`;
          notice.style.display = 'flex';
        }
      }
    }
  </script>
</body>
</html>
